- rule:
    name: V001
    message: Volt string literals should use single quotes.
    default: true
    flags: re.DOTALL
    patterns:
      - |-
        (?:\{\{(?:(?:'(?:\\.|[^'\\])*')|[^'"}])*"(?:\\.|[^"\\])*"(?:(?!\}\}).)*\}\}|\{%(?:(?:'(?:\\.|[^'\\])*')|[^'"}])*"(?:\\.|[^"\\])*"(?:(?!%\}).)*%\})
